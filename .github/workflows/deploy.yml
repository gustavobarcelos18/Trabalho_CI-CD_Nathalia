name: Deploy da Jornada DevOps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test
        run: test -f index.html
      - name: Explorando o Runner
        run: |
          lsb_release -a
          free -h
          nproc
  instalar-ferramenta:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cowsay neste runner
        run: |
          sudo apt-get update
          sudo apt-get install -y cowsay
          /usr/games/cowsay 'Instalado neste job'
  publicar-site:
    needs: [validacao, instalar-ferramenta]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Usar ferramenta instalada no outro job
        run: /usr/games/cowsay 'Outro job'
      - name: Conferir página inicial
        run: test -f index.html
      - name: Preparar pacote de distribuição
        run: |
          rm -rf dist
          mkdir -p dist
          cp ./*.html dist/
          cp -R assets dist/
          cp -R css dist/
          ls -R dist
      - name: Auditoria de Qualidade
        run: |
          test -f dist/index.html
          test -f dist/sobre.html
          test -f dist/contato.html
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
