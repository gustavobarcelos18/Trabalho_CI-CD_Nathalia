name: Deploy da Jornada DevOps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test
        run: test -f index.html
      - name: Falha intencional
        run: exit 1
      - name: Explorando o Runner
        run: |
          lsb_release -a
          free -h
          nproc
  publicar-site:
    needs: validacao
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir página inicial
        run: test -f index.html
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
