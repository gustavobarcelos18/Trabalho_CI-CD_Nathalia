name: Verificar mascaramento da secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar secret configurada e mascaramento
        env:
          CHAVE: ${{ secrets.CHAVE_MESTRA }}
        run: |
          if [ -z "$CHAVE" ]; then
            echo 'A secret CHAVE_MESTRA não está configurada.'
            exit 1
          fi
          echo "$CHAVE"
