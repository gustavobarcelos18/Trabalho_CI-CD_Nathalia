name: Auditoria inicial da Jornada DevOps

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v99
      - name: Checar arquivos estáticos após checkout
        run: |
          ls -R
          echo "Todos os arquivos foram carregados no Runner!"
          echo "Arquivos HTML: $(find . -name '*.html' | wc -l)"
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm ci
      - name: Validar sintaxe do HTML
        run: npm run lint:html
